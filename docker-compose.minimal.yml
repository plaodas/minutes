version: "3.8"
services:
  minutes:
    build:
      context: .
      args:
        # Avoid installing the large `requirements.txt` by default to keep
        # the API image lightweight. Set to "true" only when you need the
        # full environment (transcription/modeling) and have sufficient bandwidth.
        INSTALL_FULL: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./data/uploads:/app/uploads
      - ./data/outputs:/app/outputs
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://host.docker.internal:11434
      # Use the host-installed model found on the Ollama host.
      - OLLAMA_MODEL=gemma4:e4b
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: "http://minutes:8000"
    ports:
      - "8080:80"
    depends_on:
      - minutes
    restart: unless-stopped
