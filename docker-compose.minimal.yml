version: "3.8"
services:
  minutes:
    build:
      context: .
      args:
        INSTALL_FULL: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./data/uploads:/app/uploads
      - ./data/outputs:/app/outputs
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://host.docker.internal:11434
    restart: unless-stopped
