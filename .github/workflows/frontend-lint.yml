name: frontend-lint

on:
  push:
    paths:
      - 'frontend/**'
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: pnpm/action-setup@v2
        with:
          version: 18
      - name: Install dependencies
        run: pnpm install
      - name: Run ESLint
        run: pnpm lint
