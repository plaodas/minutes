server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache static assets aggressively
  location ~* \.(?:js|css|png|jpg|jpeg|svg|gif|ico|woff2)$ {
    expires 30d;
    add_header Cache-Control "public";
  }

  # Serve service worker at root
  location = /sw.js {
    try_files /sw.js =404;
  }
}
