version: "3.8"
services:
  minutes:
    build:
      context: .
      args:
        INSTALL_FULL: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./data/uploads:/app/uploads
      - ./data/outputs:/app/outputs
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://ollama-container:11434
      - INFERENCE_URL=http://inference:5001/transcribe
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    build:
      context: .
      args:
        INSTALL_FULL: "false"
    command: celery -A minutes.tasks worker -Q minutes --loglevel=info
    depends_on:
      - redis
    volumes:
      - ./:/app
      - ./data/uploads:/app/uploads
      - ./data/outputs:/app/outputs
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://ollama-container:11434
      - INFERENCE_URL=http://inference:5001/transcribe
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: "/api"
    ports:
      - "8080:80"
    depends_on:
      - minutes
    restart: unless-stopped

  inference:
    build:
      context: .
      args:
        INSTALL_FULL: "true"
    ports:
      - "5001:5001"
    volumes:
      - ./:/app
      - ./data/uploads:/app/uploads
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn minutes.inference_app:app --host 0.0.0.0 --port 5001
    restart: unless-stopped
