version: "3.8"
services:
  minutes:
    build:
      context: .
      args:
        INSTALL_FULL: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./data/uploads:/app/uploads
      - ./data/outputs:/app/outputs
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://ollama-container:11434
      - INFERENCE_URL=http://inference:5001/transcribe
      - DATABASE_URL=postgresql://${POSTGRES_USER:-minutes}:${POSTGRES_PASSWORD:-minutes_password}@db:5432/${POSTGRES_DB:-minutes}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - FORCE_ADMIN=true
      - MINIO_DEFAULT_BUCKET=${MINIO_DEFAULT_BUCKET:-outputs}
    env_file:
      - .env
    depends_on:
      - db
    # wait for DB and Redis to be reachable before starting the API
    command: ["/bin/bash", "-lc", "./scripts/wait-for-deps.sh db 5432 redis 6379 -- uvicorn backend.app:app --host 0.0.0.0 --port 8000"]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    build:
      context: .
      args:
        INSTALL_FULL: "false"
    # Wait for Redis and Postgres to be reachable before starting the worker
    command: ["/bin/bash", "-lc", "./scripts/wait-for-deps.sh redis 6379 db 5432 -- celery -A minutes.tasks worker -Q minutes --loglevel=info"]
    volumes:
      - ./:/app
      - ./data/uploads:/app/uploads
      - ./data/outputs:/app/outputs
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://ollama-container:11434
      - INFERENCE_URL=http://inference:5001/transcribe
      - DATABASE_URL=postgresql://${POSTGRES_USER:-minutes}:${POSTGRES_PASSWORD:-minutes_password}@db:5432/${POSTGRES_DB:-minutes}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_DEFAULT_BUCKET=${MINIO_DEFAULT_BUCKET:-outputs}
    env_file:
      - .env
    depends_on:
      - redis
      - db
      - inference
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: "/api"
        VITE_SHOW_ADMIN_CONTROLS: "true"
    ports:
      - "8080:80"
    depends_on:
      - minutes
    restart: unless-stopped

  inference:
    build:
      context: .
      args:
        INSTALL_FULL: "true"
    ports:
      - "5001:5001"
    volumes:
      - ./:/app
      - ./data/uploads:/app/uploads
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-minutes}:${POSTGRES_PASSWORD:-minutes_password}@db:5432/${POSTGRES_DB:-minutes}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_DEFAULT_BUCKET=${MINIO_DEFAULT_BUCKET:-outputs}
    # wait for DB and Redis to be reachable before starting inference service
    command: ["/bin/bash", "-lc", "./scripts/wait-for-deps.sh db 5432 redis 6379 -- uvicorn minutes.inference_app:app --host 0.0.0.0 --port 5001"]
    restart: unless-stopped
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-minutes}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-minutes_password}
      - POSTGRES_DB=${POSTGRES_DB:-minutes}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  pgdata:
    driver: local

