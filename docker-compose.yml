version: "3.8"
services:
  minutes:
    build:
      context: .
      args:
        INSTALL_FULL: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./data/uploads:/app/uploads
      - ./data/outputs:/app/outputs
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    build:
      context: .
      args:
        INSTALL_FULL: "true"
    command: celery -A minutes.tasks worker --loglevel=info
    depends_on:
      - redis
    volumes:
      - ./:/app
      - ./data/uploads:/app/uploads
      - ./data/outputs:/app/outputs
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: "/api"
    ports:
      - "8080:80"
    depends_on:
      - minutes
    restart: unless-stopped
