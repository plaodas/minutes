x-app-environment: &app-environment
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: postgresql://${POSTGRES_USER:-minutes}:${POSTGRES_PASSWORD:-minutes_password}@db:5432/${POSTGRES_DB:-minutes}
  REDIS_URL: redis://redis:6379/0
  OUTPUTS_DIR: /app/outputs
  UPLOADS_DIR: /app/uploads
  JWT_SECRET: ${JWT_SECRET:-portfolio-dev-secret-change-me}
  ENV: dev
  FORCE_HTTPS: "0"

x-app-volumes: &app-volumes
  - ./data/uploads:/app/uploads
  - ./data/outputs:/app/outputs

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-minutes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minutes_password}
      POSTGRES_DB: ${POSTGRES_DB:-minutes}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: minutes-api:local
    build:
      context: .
      args:
        INSTALL_FULL: "false"
    environment: *app-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  bootstrap:
    image: minutes-api:local
    build:
      context: .
      args:
        INSTALL_FULL: "false"
    environment:
      <<: *app-environment
      ADMIN_USER: ${ADMIN_USER:-demo}
      ADMIN_PASS: ${ADMIN_PASS:-demo}
    command: ["python", "scripts/create_admin.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  minutes:
    image: minutes-api:local
    build:
      context: .
      args:
        INSTALL_FULL: "false"
    environment: *app-environment
    volumes: *app-volumes
    command: ["uvicorn", "backend.app:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  worker:
    image: minutes-worker:local
    build:
      context: .
      args:
        INSTALL_WORKER: "true"
    environment:
      <<: *app-environment
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_FALLBACK_MODELS: ${OLLAMA_FALLBACK_MODELS:-}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-5}
      TRANSCRIBE_MODEL_SIZE: ${TRANSCRIBE_MODEL_SIZE:-small}
    volumes: *app-volumes
    command:
      [
        "celery",
        "-A",
        "minutes.celery_app.celery",
        "worker",
        "-Q",
        "minutes",
        "--loglevel=info",
      ]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A minutes.celery_app.celery inspect ping -d celery@$${HOSTNAME} --timeout 5 | grep -q pong",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
        VITE_SHOW_ADMIN_CONTROLS: "true"
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      minutes:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["llm"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen2.5:3b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  ollama_data:
