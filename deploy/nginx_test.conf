server {
    listen 80;
    server_name localhost;

    # Allow larger uploads (100MB)
    client_max_body_size 100m;
    client_body_timeout 120s;

    # Serve static files from frontend/dist
    root /usr/share/nginx/html;
    index index.html;

    # Try static files first, fall back to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls (frontend uses /api/*) to the minutes backend
    # Strip the /api prefix when proxying so /api/bg -> /bg on backend
    location /api/ {
        proxy_pass http://minutes:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_cache off;
    }

    # SSE endpoint under /api/bg/events should not be buffered
    location /api/bg/events {
        proxy_pass http://minutes:8000/bg/events;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Cache-Control "no-cache";
    }

}
