server {
    listen 80;
    server_name example.com; # <--- replace with your domain

    # Redirect all HTTP to HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name example.com; # <--- replace with your domain

    # Allow larger uploads (100MB)
    client_max_body_size 100m;
    client_body_timeout 120s;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem; # managed by certbot
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_cache off;
    }

    # Server-Sent Events endpoint: disable buffering and allow long-lived connections
    location /bg/events {
        proxy_pass http://127.0.0.1:8000/bg/events;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ensure connection stays open and Nginx does not buffer responses
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Avoid caching SSE responses
        add_header Cache-Control "no-cache";
    }
}
